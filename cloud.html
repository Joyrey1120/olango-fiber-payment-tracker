<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Olango Fiber Network — Shared Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script>
<style>
:root{--navy:#10243a;--cyan:#00a6c7;--bg:#f3f6fa;--ink:#192b3b;--muted:#637486;--line:#dfe7ef;--red:#b4232e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Arial,sans-serif}header{background:var(--navy);color:#fff;padding:18px max(18px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:21px;margin:0}header p{margin:3px 0;color:#c8d7e4;font-size:13px}.shell{max-width:1100px;margin:auto;padding:20px 16px 44px}.panel,.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:25px;margin-top:5px;overflow-wrap:anywhere}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.tabs button,button{border:0;border-radius:9px;padding:10px 13px;background:var(--cyan);color:white;font-weight:bold;cursor:pointer}.tabs button{background:#e3eaf1;color:var(--navy)}.tabs button.active{background:var(--navy);color:white}button.secondary{background:#e3eaf1;color:var(--navy)}button:disabled{opacity:.6;cursor:wait}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:bold;color:var(--muted)}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd7e2;border-radius:8px;font:inherit;background:white}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.hidden{display:none!important}.notice{padding:11px 13px;background:#eaf6fa;border-radius:9px;margin:12px 0;font-size:13px}.error{color:var(--red)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-size:11px;text-transform:uppercase;background:#f8fafc}#status,#loginStatus{overflow-wrap:anywhere}.tag{background:#eaf6f1;color:#12805c;padding:4px 8px;border-radius:99px;font-size:12px;font-weight:bold}.danger{background:#fff1f0;color:#922b21}@media(max-width:600px){.shell{padding:12px}.panel{padding:12px}}
</style></head><body>
<header><div><h1>Olango Fiber Network</h1><p>Shared customer and collections tracker</p></div><div><span id="roleTag" class="tag hidden"></span> <button id="logout" class="secondary hidden">Sign out</button></div></header>
<main class="shell"><section id="loginPanel" class="panel"><h2>Staff login</h2><p>Sign in with your own Olango Fiber staff account.</p><form id="loginForm"><div class="formgrid"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div></div><div class="actions"><button id="loginBtn">Sign in</button></div></form><p id="loginStatus" role="status"></p></section>
<section id="app" class="hidden"><div class="notice danger"><strong>Testing mode:</strong> Verify admin and collector permissions with sample records before importing real customer data or using this for actual collections.</div><div class="tabs"><button data-tab="dashboard" class="active">Dashboard</button><button data-tab="customers">Customers</button><button data-tab="payments">Record payment</button><button data-tab="history">Payment history</button><button data-tab="expenses" id="expensesTab">Expenses</button></div><div id="status" class="notice" role="status">Connecting…</div><div id="view"></div></section></main>
<script>
const db=window.supabase.createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.publishableKey);let user=null,profile=null,customers=[],payments=[],expenses=[],tab='dashboard';const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('en-PH',{style:'currency',currency:'PHP',maximumFractionDigits:2}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};const isAdmin=()=>profile?.role==='admin';function msg(s,bad=false){$('status').textContent=s;$('status').classList.toggle('error',bad)}function setTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginBtn').disabled=true;$('loginStatus').textContent='Signing in…';try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await startApp()}catch(err){$('loginStatus').textContent='Login failed: '+err.message}finally{$('loginBtn').disabled=false}});$('logout').addEventListener('click',async()=>{await db.auth.signOut();user=null;profile=null;$('app').classList.add('hidden');$('loginPanel').classList.remove('hidden');$('logout').classList.add('hidden');$('roleTag').classList.add('hidden');$('loginStatus').textContent='Signed out.'});
async function startApp(){const {data:{user:u},error:ue}=await db.auth.getUser();if(ue)throw ue;if(!u)throw new Error('Please sign in again.');user=u;const {data:p,error}=await db.from('profiles').select('full_name,role,active').eq('user_id',u.id).single();if(error)throw new Error('Profile lookup failed: '+error.message);if(!p.active||!['admin','collector'].includes(p.role)){await db.auth.signOut();throw new Error('Account is inactive or missing a valid role. Ask the admin to check the profile.')}profile=p;$('loginPanel').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('roleTag').classList.remove('hidden');$('roleTag').textContent=p.role.toUpperCase()+' · '+(p.full_name||u.email);$('expensesTab').classList.toggle('hidden',!isAdmin());await refreshData()}
async function refreshData(){msg('Loading shared records…');try{const [cr,pr]=await Promise.all([db.from('customers').select('*').order('name'),db.from('payments').select('*').order('payment_date',{ascending:false})]);if(cr.error)throw cr.error;if(pr.error)throw pr.error;customers=cr.data||[];payments=pr.data||[];expenses=[];if(isAdmin()){const er=await db.from('expenses').select('*').order('expense_date',{ascending:false});if(er.error)throw er.error;expenses=er.data||[]}msg('Connected to Supabase. Loaded '+customers.length+' customers and '+payments.length+' payments visible to your account.');render()}catch(err){msg('Could not load shared records: '+err.message,true)}}function customerName(id){return customers.find(c=>c.id===id)?.name||'Unknown customer'}function render(){const v=$('view');if(tab==='dashboard')v.innerHTML=dashboard();else if(tab==='customers')v.innerHTML=customerView();else if(tab==='payments')v.innerHTML=paymentView();else if(tab==='history')v.innerHTML=historyView();else if(tab==='expenses'&&isAdmin())v.innerHTML=expenseView();else{tab='dashboard';v.innerHTML=dashboard()}}
function dashboard(){const t=payments.filter(p=>p.payment_date===today()),m=payments.filter(p=>(p.payment_date||'').slice(0,7)===today().slice(0,7)).reduce((s,p)=>s+Number(p.amount||0),0);return '<div class="grid"><div class="metric"><small>Customers loaded</small><strong>'+customers.length+'</strong></div><div class="metric"><small>Collections today (visible)</small><strong>'+money(t.reduce((s,p)=>s+Number(p.amount||0),0))+'</strong></div><div class="metric"><small>Collections this month (visible)</small><strong>'+money(m)+'</strong></div><div class="metric"><small>Payments visible to account</small><strong>'+payments.length+'</strong></div></div><div class="panel"><h2>Welcome, '+esc(profile.full_name||user.email)+'</h2><p>These records are read from Supabase. '+(isAdmin()?'Admin access: customers, payments and expenses.':'Collector access: view customers and record payments.')+'</p><button onclick="setTab(\'payments\')">Record a payment</button></div>'}
function customerView(){return '<div class="panel"><h2>Customers</h2><p>'+customers.length+' customer(s) visible.</p><div class="field"><label>Search</label><input id="customerSearch" placeholder="Name, contact, address or area" oninput="filterCustomers()"></div>'+(isAdmin()?'<h3>Add customer</h3><form id="customerForm"><div class="formgrid"><div class="field"><label>Client name</label><input name="name" required></div><div class="field"><label>Contact number</label><input name="contact_no"></div><div class="field"><label>Address</label><input name="address"></div><div class="field"><label>Service area</label><select name="service_area"><option>Baring</option><option>Causwagan</option><option>Caw-oy</option><option>Mainit</option><option>Pangan-an</option><option>Sabang</option><option>San Vicente</option><option>Sta. Rosa</option><option>Talima</option><option>Unassigned</option></select></div><div class="field"><label>Monthly due (₱)</label><input name="monthly_fee" type="number" min="0" step=".01" required></div><div class="field"><label>Due day (1–31)</label><input name="due_day" type="number" min="1" max="31" value="1" required></div></div><div class="actions"><button>Add customer</button></div></form>':'')+'<div class="tablewrap"><table><thead><tr><th>Customer</th><th>Contact</th><th>Area / address</th><th>Monthly due</th><th>Status</th></tr></thead><tbody id="customerRows">'+customers.map(c=>'<tr data-search="'+esc([c.name,c.contact_no,c.address,c.service_area].join(' ').toLowerCase())+'"><td>'+esc(c.name)+'</td><td>'+esc(c.contact_no||'')+'</td><td>'+esc([c.service_area,c.address].filter(Boolean).join(' · '))+'</td><td>'+money(c.monthly_fee)+'</td><td>'+esc(c.status||'active')+'</td></tr>').join('')+'</tbody></table></div></div>'}function filterCustomers(){const q=($('customerSearch')?.value||'').toLowerCase();document.querySelectorAll('#customerRows tr').forEach(r=>r.hidden=!r.dataset.search.includes(q))}
function paymentView(){return '<div class="panel"><h2>Record payment</h2><form id="paymentForm"><div class="formgrid"><div class="field"><label>Customer</label><select name="customer_id" required><option value="">Choose customer</option>'+customers.filter(c=>c.status!=='inactive').map(c=>'<option value="'+c.id+'">'+esc(c.name)+' · '+esc(c.service_area||'')+'</option>').join('')+'</select></div><div class="field"><label>Date</label><input name="payment_date" type="date" value="'+today()+'" required></div><div class="field"><label>Amount (₱)</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>Method</label><select name="method"><option>Cash</option><option>GCash</option><option>Bank transfer</option><option>Other</option></select></div><div class="field"><label>Reference</label><input name="reference_no"></div><div class="field"><label>Notes</label><input name="notes"></div></div><div class="actions"><button>Save payment to shared database</button></div></form></div>'}
function historyView(){return '<div class="panel"><h2>Payment history</h2><p>Showing payments permitted for this account.</p><div class="tablewrap"><table><thead><tr><th>Date</th><th>Receipt</th><th>Customer</th><th>Collector</th><th>Method</th><th>Amount</th></tr></thead><tbody>'+payments.map(p=>'<tr><td>'+esc(p.payment_date)+'</td><td>'+esc(p.receipt_no||'')+'</td><td>'+esc(customerName(p.customer_id))+'</td><td>'+(p.collector_user_id===user.id?'You':(isAdmin()?'Staff':'—'))+'</td><td>'+esc(p.method||'')+'</td><td>'+money(p.amount)+'</td></tr>').join('')+'</tbody></table></div></div>'}
function expenseView(){return '<div class="panel"><h2>Expenses (admin only)</h2><form id="expenseForm"><div class="formgrid"><div class="field"><label>Date</label><input name="date" type="date" value="'+today()+'" required></div><div class="field"><label>Category</label><input name="category" required></div><div class="field"><label>Description</label><input name="description" required></div><div class="field"><label>Amount (₱)</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>Method</label><input name="method" value="Cash"></div><div class="field"><label>Notes</label><input name="notes"></div></div><div class="actions"><button>Save expense</button></div></form><div class="tablewrap"><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th></tr></thead><tbody>'+expenses.map(e=>'<tr><td>'+esc(e.expense_date)+'</td><td>'+esc(e.category)+'</td><td>'+esc(e.description)+'</td><td>'+money(e.amount)+'</td></tr>').join('')+'</tbody></table></div></div>'}
document.addEventListener('submit',async e=>{if(e.target.id==='customerForm'){e.preventDefault();if(!isAdmin())return;const f=new FormData(e.target),row={customer_code:'OFN-'+Date.now().toString(36).toUpperCase(),name:String(f.get('name')).trim(),contact_no:String(f.get('contact_no')||'').trim()||null,address:String(f.get('address')||'').trim()||null,service_area:String(f.get('service_area')||'Unassigned'),monthly_fee:Number(f.get('monthly_fee')),due_day:Number(f.get('due_day')),status:'active'};try{const {error}=await db.from('customers').insert(row);if(error)throw error;e.target.reset();await refreshData();setTab('customers');msg('Customer saved to shared database.')}catch(err){msg('Customer was not saved: '+err.message,true)}}if(e.target.id==='paymentForm'){e.preventDefault();const f=new FormData(e.target),row={receipt_no:'OFN-'+Date.now().toString(36).toUpperCase(),customer_id:String(f.get('customer_id')),payment_date:String(f.get('payment_date')),amount:Number(f.get('amount')),method:String(f.get('method')||'Cash'),reference_no:String(f.get('reference_no')||'').trim()||null,collector_user_id:user.id,notes:String(f.get('notes')||'').trim()||null};try{const {error}=await db.from('payments').insert(row);if(error)throw error;e.target.reset();await refreshData();setTab('history');msg('Payment saved to shared database. Receipt: '+row.receipt_no)}catch(err){msg('Payment was not saved: '+err.message,true)}}if(e.target.id==='expenseForm'){e.preventDefault();if(!isAdmin())return;const f=new FormData(e.target),row={expense_date:String(f.get('date')),category:String(f.get('category')),description:String(f.get('description')),amount:Number(f.get('amount')),method:String(f.get('method')||'Cash'),recorded_by:user.id,notes:String(f.get('notes')||'').trim()||null};try{const {error}=await db.from('expenses').insert(row);if(error)throw error;e.target.reset();await refreshData();setTab('expenses');msg('Expense saved to shared database.')}catch(err){msg('Expense was not saved: '+err.message,true)}}});
(async()=>{if(!window.SUPABASE_CONFIG?.url||!window.SUPABASE_CONFIG?.publishableKey){$('loginStatus').textContent='Supabase configuration missing. Check supabase-config.js.';return}try{const {data:{session}}=await db.auth.getSession();if(session)await startApp()}catch(err){$('loginStatus').textContent=err.message}})();
</script></body></html>
